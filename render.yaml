services:
  - type: web
    name: trading-bot-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --worker-class gthread --workers 1 --threads 4
    envVars:
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: CONTROL_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Render has no local Ollama server to reach, so this deployment keeps
      # using Groq (config.py's AI_PROVIDER default is "ollama", meant for
      # local runs). To point at a self-hosted Ollama instead, override
      # AI_PROVIDER=ollama and OLLAMA_HOST here.
      - key: AI_PROVIDER
        value: groq
      - key: ALLOWED_ORIGIN
        value: https://ymanda123.github.io
      - key: SYMBOL
        value: BTC/USDT
      - key: TIMEFRAME
        value: 1h
